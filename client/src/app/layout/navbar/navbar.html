<nav class="navbar">
  <a class="brand" [routerLink]="auth.isAdmin() ? '/admin' : '/dashboard'">Exam Portal</a>

  <div class="links">
    @if (auth.isLoggedIn()) {
      @if (auth.isAdmin()) {
        <a routerLink="/admin/questions" routerLinkActive="active">Questions</a>
        <a routerLink="/admin/exams" routerLinkActive="active">Exams</a>
        <a routerLink="/admin/results" routerLinkActive="active">Results</a>
        <a routerLink="/admin/grading" routerLinkActive="active">Grading</a>
      } @else {
        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Exams</a>
        <a routerLink="/admission" routerLinkActive="active">Admission</a>
        <a routerLink="/results" routerLinkActive="active">My Results</a>
      }
      <span class="user">{{ auth.currentUser()?.name }}</span>
      <button class="link-btn" type="button" (click)="logout()">Logout</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Login</a>
      <a routerLink="/register" routerLinkActive="active">Register</a>
    }
  </div>
</nav>
