<nav class="navbar">
  <a class="brand" routerLink="/">
    <span class="brand-mark">
      <img src="favicon.png" alt="" width="28" height="28" />
    </span>
    <span class="brand-text">Questify</span>
  </a>

  <button class="menu-toggle" type="button" [class.is-open]="menuOpen()" (click)="toggleMenu()" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>

  <div class="links" [class.is-open]="menuOpen()">
    @if (auth.isLoggedIn()) {
      @if (auth.isAdmin()) {
        <a routerLink="/admin/subjects" routerLinkActive="active">Subjects</a>
        <a routerLink="/admin/questions" routerLinkActive="active">Questions</a>
        <a routerLink="/admin/exams" routerLinkActive="active">Exams</a>
        <a routerLink="/admin/results" routerLinkActive="active">Results</a>
        <a routerLink="/admin/grading" routerLinkActive="active">Grading</a>
      } @else {
        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Exams</a>
        <a routerLink="/results" routerLinkActive="active">Results</a>
      }

      <div class="user-meta">
        <span class="avatar">{{ (auth.currentUser()?.name || '?').charAt(0).toUpperCase() }}</span>
        <span class="user-name">{{ auth.currentUser()?.name }}</span>
      </div>
      <button class="logout-btn" type="button" (click)="logout()">Logout</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Login</a>
      <a routerLink="/register" routerLinkActive="active" class="btn btn-sm">Register</a>
    }
  </div>
</nav>
