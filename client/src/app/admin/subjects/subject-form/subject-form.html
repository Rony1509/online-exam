<div class="page" style="max-width: 480px;">
  <h2>{{ editingId ? 'Edit subject' : 'Add subject' }}</h2>

  @if (loading()) {
    <p class="muted">Loading subject...</p>
  } @else {
    <div class="card">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" type="text" formControlName="name" placeholder="e.g. Physics" />
        </div>
        <p class="muted" style="margin-top: -0.5rem;">
          Add chapters under this subject to tag it with a section (SSC, HSC, Admission, ...).
        </p>

        @if (errorMessage()) {
          <p class="error-text">{{ errorMessage() }}</p>
        }

        <div class="row" style="margin-top: 1rem;">
          <button class="btn" type="submit" [disabled]="saving()">
            {{ saving() ? 'Saving...' : 'Save subject' }}
          </button>
          <a class="btn btn-secondary" routerLink="/admin/subjects">Cancel</a>
        </div>
      </form>
    </div>
  }
</div>
