<div class="page" style="max-width: 420px;">
  <div class="card">
    <h2>Create your student account</h2>
    <p class="muted">Register to take HSC or SSC exams.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="name">Full name</label>
        <input id="name" type="text" formControlName="name" autocomplete="name" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password" />
        <span class="muted" style="font-size: 0.8rem;">At least 6 characters</span>
      </div>

      <div class="form-group">
        <label for="section">Section</label>
        <select id="section" formControlName="section">
          <option value="SSC">SSC</option>
          <option value="HSC">HSC</option>
        </select>
      </div>

      @if (errorMessage()) {
        <p class="error-text">{{ errorMessage() }}</p>
      }

      <button class="btn" type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating account...' : 'Register' }}
      </button>
    </form>

    <p class="muted" style="margin-top: 1rem;">
      Already have an account? <a routerLink="/login">Log in</a>
    </p>
  </div>
</div>
